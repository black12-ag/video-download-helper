<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Download Helper</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><div class="brand"><img class="mark" src="icons/48.png" alt="" aria-hidden="true"><div><h1>Video Download Helper</h1><p id="site">Loading…</p></div></div><button id="scan" class="icon-button" aria-label="Scan page" title="Scan page">↻</button></header>
  <main>
    <nav aria-label="Video lists"><button id="current" class="tab active" aria-pressed="true">On this page <span id="count">0</span></button><button id="saved" class="tab" aria-pressed="false">Saved videos</button></nav>
    <div class="toolbar"><p id="summary">Looking for videos…</p><button id="formats" class="text-button">Find all qualities</button></div>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="jobs" aria-label="Other downloads"></section>
    <section id="videos" aria-label="Detected videos"></section>
    <aside id="hint">Play a video to detect it. Use ↻ if it hasn’t appeared.</aside>
  </main>
  <footer><span>Free · Open source</span><button id="downloads">Browser downloads ↗</button></footer>
  <script type="module" src="popup.js"></script>
</body></html>
