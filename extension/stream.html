<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Save video — Video Download Helper</title><link rel="stylesheet" href="stream.css"></head>
<body><main>
  <header><img src="icons/48.png" alt=""><div><h1>Save video</h1><p>Video Download Helper</p></div></header>
  <p id="quality"></p><p id="source"></p>
  <label for="filename">Filename</label><input id="filename" maxlength="180" autocomplete="off">
  <p id="instructions">Choose Save and a file location to start. Keep this tab open until the video is saved.</p>
  <div class="actions"><button id="save" disabled>Save video…</button><button id="stop" disabled>Stop</button></div>
  <progress id="progress" max="100" aria-label="Download progress"></progress>
  <p id="status" role="status" aria-live="polite">Loading download…</p>
  <p class="limit">Supported AVC/AAC HLS recordings are combined in your browser. Protected streams and live broadcasts are unsupported.</p>
</main><script type="module" src="stream.js"></script></body></html>
